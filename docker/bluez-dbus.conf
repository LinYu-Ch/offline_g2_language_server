<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Second address for the system bus, in /mnt/wsl (shared by all WSL distros).
     The gateway container reaches BlueZ through it. -->
<busconfig>
  <listen>unix:path=/mnt/wsl/evenG2/system_bus_socket</listen>
</busconfig>
