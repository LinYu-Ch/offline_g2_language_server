# Linux host (Docker Engine, or Docker inside a WSL distro).
services:
  # The user's PulseAudio / PipeWire (pipewire-pulse) socket. PulseAudio accepts
  # clients with the socket owner's UID without a cookie, so the container runs
  # as the host user. The Makefile sets HOST_UID, HOST_GID and XDG_RUNTIME_DIR.
  stream:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/pulse/native
    environment:
      PULSE_SERVER: unix:/run/pulse/native
      HOME: /tmp
    # Docker Desktop defines host.docker.internal; Docker Engine needs this.
    # Used by `make captions GATEWAY=local`.
    extra_hosts:
      - host.docker.internal:host-gateway

  # Downloaded models belong to the host user, not root.
  models:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  # The host's BlueZ over its system D-Bus socket.
  gateway:
    volumes:
      - /var/run/dbus:/var/run/dbus
    security_opt:
      - apparmor:unconfined
